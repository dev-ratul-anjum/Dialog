name: Keep Backend Alive

on:
  schedule:
    # Cron expression: run every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch: # Optional: manually trigger the workflow

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        id: ping
        run: |
          URL="https://dialog-engine.onrender.com/api/health"
          echo "Pinging backend: $URL"

          # Retry logic: try 3 times if request fails
          SUCCESS=false
          for i in 1 2 3; do
            # Send GET request and capture HTTP status code
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL)
            echo "Attempt $i: Response code $RESPONSE"
            
            # If HTTP 200, backend is alive
            if [ "$RESPONSE" -eq 200 ]; then
              SUCCESS=true
              break
            fi

            # Wait 5 seconds before retrying
            echo "Failed attempt $i, retrying in 5 seconds..."
            sleep 5
          done

          # Exit with error if all retries fail
          if [ "$SUCCESS" = false ]; then
            echo "❌ Backend did not respond successfully after 3 attempts!"
            exit 1
          else
            echo "✅ Backend is alive!"
          fi
